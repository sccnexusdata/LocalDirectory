project:
  name: LocalDirectory
  slug: localdirectory

# Generic template only. Copy this file to config/<locality>.yaml and provide
# real coordinates before running a harvest. Presentation-site exports are
# opt-in through outputs.site_bundle so the engine has no built-in town brand.
location:
  name: Local Area
  country: GB
  postcode: ""
  latitude: null
  longitude: null
  radius_miles: 10
  radius_km: 16.0934

outputs:
  directory: exports

policy:
  minimum_independent_sources: 2
  allow_class_a_single_source: true
  publish_registered_office_addresses: false
  disclaimer: >-
    Listings are local signposts, not recommendations. Check current trading status,
    insurance, qualifications, memberships, regulated status and written quotes directly.

sources:
  enabled:
    - fhrs
    - osm_overpass
    - companies_house
    - json_ld
  manual_csv: data/manual/listings.csv
  websites: []
  overpass_endpoint: https://overpass-api.de/api/interpreter
  companies_house_max_results: 500
