project:
  name: LewesLive Local Directory
  slug: lewes

location:
  name: Lewes
  country: GB
  postcode: BN7 2NB
  postcode_area: BN7
  latitude: 50.8739
  longitude: 0.0088
  radius_miles: 10
  radius_km: 16.0934

outputs:
  directory: exports
  site_bundle:
    slug: leweslive
    js_global: LEWESLIVE_DIRECTORY

policy:
  minimum_independent_sources: 2
  allow_class_a_single_source: true
  publish_registered_office_addresses: false
  coverage:
    minimum_publish_safe: 300
    minimum_priority_categories_with_3_records: 14
    minimum_trade_categories_with_2_records: 7
    minimum_website_coverage: 0.25
    minimum_contact_coverage: 0.40
    minimum_geocoded_coverage: 0.65
    minimum_multi_source_coverage: 0.20
  disclaimer: >-
    LewesLive is a local signposting directory. Listings are not recommendations.
    Check current trading status, insurance, qualifications, memberships, regulated
    status, reviews and written quotes directly before hiring or travelling.

sources:
  enabled:
    - fhrs
    - cqc
    - charity_commission
    - osm_overpass
    - owned_accommodation
    - visit_lewes_accommodation
    - lewes_chamber
    - companies_house
    - json_ld
  manual_csv: data/manual/listings.csv
  websites: []
  json_ld_max_websites: 160
  json_ld_trade_per_category: 12
  json_ld_workers: 6
  json_ld_timeout_seconds: 12
  postcode_enrichment: true
  postcode_timeout_seconds: 20
  cqc_index_url: https://www.cqc.org.uk/about-us/transparency/using-cqc-data
  cqc_csv_url: ""
  cqc_timeout_seconds: 60
  charity_commission_index_url: https://register-of-charities.charitycommission.gov.uk/en/register/full-register-download
  charity_commission_zip_url: ""
  charity_commission_postcode_endpoint: https://api.postcodes.io/postcodes
  charity_commission_timeout_seconds: 90
  charity_commission_candidate_postcode_prefixes:
    - BN1
    - BN2
    - BN6
    - BN7
    - BN8
    - BN9
    - BN10
    - BN25
    - BN26
    - BN27
    - TN22
    - RH15
    - RH16
    - RH17
  overpass_endpoint: https://overpass-api.de/api/interpreter
  owned_accommodation_seeds:
    - name: The White Hart
      url: https://whitehartlewes.com/
  owned_accommodation_timeout_seconds: 20
  visit_lewes_accommodation_index_urls:
    - https://www.visitlewes.co.uk/accommodation/bed-and-breakfasts?p=1
    - https://www.visitlewes.co.uk/accommodation/self-catering?p=1
    - https://www.visitlewes.co.uk/accommodation/hotels
    - https://www.visitlewes.co.uk/accommodation/pubs-and-inns?p=1
  visit_lewes_accommodation_max_results: 160
  visit_lewes_accommodation_pages_per_index: 4
  visit_lewes_accommodation_workers: 4
  visit_lewes_accommodation_timeout_seconds: 20
  lewes_chamber_index_url: https://www.leweschamber.co.uk/members-directory/
  lewes_chamber_max_results: 200
  lewes_chamber_workers: 4
  lewes_chamber_timeout_seconds: 20
  companies_house_max_results: 500
