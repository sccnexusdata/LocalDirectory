sources:
  - name: Food Standards Agency FHRS
    class: A
    purpose: food establishment discovery and corroboration
    url: https://api.ratings.food.gov.uk/help
    adapter: fhrs
  - name: Companies House
    class: A
    purpose: corporate identity and active-company candidate discovery
    url: https://developer-specs.company-information.service.gov.uk/companies-house-public-data-api/reference
    adapter: companies_house
  - name: OpenStreetMap
    class: D
    purpose: broad place and service discovery with geospatial data
    url: https://wiki.openstreetmap.org/wiki/Overpass_API
    adapter: osm_overpass
  - name: Lewes Chamber of Commerce members directory
    class: C
    purpose: local business discovery and corroboration; recipe adapter planned
    url: https://www.leweschamber.co.uk/members-directory/
    adapter: planned_directory_recipe
  - name: Visit Lewes shopping and food directories
    class: C
    purpose: visitor-facing place discovery and corroboration; recipe adapter planned
    url: https://www.visitlewes.co.uk/things-to-do/shopping
    adapter: planned_directory_recipe
  - name: Lewes.co.uk business directory
    class: E
    purpose: broad legacy candidate discovery only; freshness must be checked independently
    url: https://lewes.co.uk/business/
    adapter: planned_directory_recipe
    usage_mode: discovery_only
    content_policy: facts_only
    canonical_verification_required: true
  - name: The Lewesian
    class: C
    purpose: advertiser and community-listing discovery; facts must be verified at the organisation's canonical source
    url: https://thelewesian.co.uk/2026-back-copies/
    adapter: manual_discovery_only
    usage_mode: discovery_only
    content_policy: facts_only
    media_policy: do_not_reuse_without_permission
    canonical_verification_required: true
  - name: Lewes News / Lewes Times
    class: C
    purpose: potential local advertiser and listing discovery after publisher identity and official online presence are confirmed
    adapter: manual_discovery_only
    usage_mode: discovery_only
    content_policy: facts_only
    media_policy: do_not_reuse_without_permission
    canonical_verification_required: true
    status: publisher_identity_verification_required
  - name: CQC
    class: A
    purpose: regulated health and care provider verification
    url: https://www.cqc.org.uk/about-us/transparency/using-cqc-data
    adapter: planned_cqc
  - name: Charity Commission
    class: A
    purpose: registered charity identity and verification
    url: https://register-of-charities.charitycommission.gov.uk/en/documentation-on-the-api
    adapter: planned_charity_commission
