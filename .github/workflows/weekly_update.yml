name: Weekly Local Directory Harvest

on:
  workflow_dispatch:
    inputs:
      config_path:
        description: "Configuration path"
        required: false
        default: "config/lewes.yaml"
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "config/**"
      - "scripts/**"
      - "data/manual/**"
      - ".github/workflows/weekly_update.yml"
  schedule:
    - cron: "35 6 * * 1"

permissions:
  contents: write

concurrency:
  group: local-directory-harvest-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUNBUFFERED: "1"
  CONFIG_PATH: ${{ inputs.config_path || 'config/lewes.yaml' }}

jobs:
  harvest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Tests
        run: pytest -q
      - name: Resolve configured presentation-site bundle
        id: bundle
        shell: bash
        run: |
          set -euo pipefail
          python - "$CONFIG_PATH" "$GITHUB_OUTPUT" <<'PY'
          import re, sys, yaml
          config_path, output_path = sys.argv[1:]
          config = yaml.safe_load(open(config_path, encoding="utf-8")) or {}
          bundle = (config.get("outputs") or {}).get("site_bundle") or {}
          slug = str(bundle.get("slug") or "").strip().lower()
          js_global = str(bundle.get("js_global") or "").strip()
          if not re.fullmatch(r"[a-z0-9][a-z0-9_-]*", slug):
              raise SystemExit(f"Configured outputs.site_bundle.slug is missing or unsafe: {slug!r}")
          if not re.fullmatch(r"[A-Za-z_$][A-Za-z0-9_$]*", js_global):
              raise SystemExit(f"Configured outputs.site_bundle.js_global is missing or unsafe: {js_global!r}")
          with open(output_path, "a", encoding="utf-8") as handle:
              handle.write(f"slug={slug}\n")
              handle.write(f"js_global={js_global}\n")
          print(f"Publishing configured site bundle: {slug} / window.{js_global}")
          PY
      - name: Run harvest
        env:
          COMPANIES_HOUSE_API_KEY: ${{ secrets.COMPANIES_HOUSE_API_KEY }}
          LOCALDIRECTORY_USER_AGENT: "LocalDirectory/0.1 (+https://github.com/sccnexusdata/LocalDirectory)"
        run: python run.py run --config "$CONFIG_PATH"
      - name: Locate generated output
        id: locate
        shell: bash
        run: |
          set -euo pipefail
          QUALITY="$(find exports -name quality-report.json -print | head -n 1)"
          if [ -z "$QUALITY" ]; then
            echo "No quality-report.json generated"
            find exports -maxdepth 3 -type f -print || true
            exit 1
          fi
          ROOT="$(dirname "$QUALITY")"
          echo "root=$ROOT" >> "$GITHUB_OUTPUT"
          echo "Output root: $ROOT"
      - name: Validate public deployment gate
        run: python scripts/validate_public_bundle.py "${{ steps.locate.outputs.root }}/public"
      - name: Build health report
        run: python scripts/project_health.py --exports-dir "${{ steps.locate.outputs.root }}" --output "${{ steps.locate.outputs.root }}/project-health.json"
      - name: Validate configured site bundle contract
        shell: bash
        run: |
          set -euo pipefail
          ROOT="${{ steps.locate.outputs.root }}"
          SITE_SLUG="${{ steps.bundle.outputs.slug }}"
          JS_GLOBAL="${{ steps.bundle.outputs.js_global }}"
          python - "$ROOT/$SITE_SLUG" "$SITE_SLUG" "$JS_GLOBAL" <<'PY'
          import json, pathlib, sys
          root = pathlib.Path(sys.argv[1])
          site_slug, js_global = sys.argv[2:]
          payload = json.loads((root / "directory.v1.json").read_text(encoding="utf-8"))
          manifest = json.loads((root / "manifest.v1.json").read_text(encoding="utf-8"))
          text = (root / "directory.v1.js").read_text(encoding="utf-8").strip()
          prefix = f"window.{js_global} = "
          assert payload.get("schemaVersion") == "1.0"
          assert payload.get("site") == site_slug
          assert isinstance(payload.get("listings"), list)
          assert manifest.get("site") == site_slug
          assert manifest.get("js_global") == js_global
          assert int(manifest.get("record_count", -1)) == len(payload["listings"])
          assert text.startswith(prefix) and text.endswith(";")
          assert json.loads(text[len(prefix):-1]) == payload
          print(f"Validated {site_slug} browser bundle with {len(payload['listings'])} records")
          PY
      - name: Evaluate feed promotion eligibility
        id: promote
        shell: bash
        run: |
          set -euo pipefail
          ROOT="${{ steps.locate.outputs.root }}"
          python - "$ROOT/source-health.json" "$ROOT/coverage-report.json" "$GITHUB_OUTPUT" <<'PY'
          import json, sys
          health_path, coverage_path, output_path = sys.argv[1:]
          health = json.load(open(health_path, encoding="utf-8"))
          coverage = json.load(open(coverage_path, encoding="utf-8"))
          by_source = {item.get("source"): item for item in health.get("sources", [])}
          critical = ("fhrs", "osm_overpass")
          failed = [name for name in critical if not by_source.get(name, {}).get("ok")]
          failed_coverage = [name for name, passed in coverage.get("checks", {}).items() if not passed]
          coverage_ready = bool(coverage.get("ready"))
          promote = not failed and coverage_ready
          with open(output_path, "a", encoding="utf-8") as handle:
              handle.write(f"promote={'true' if promote else 'false'}\n")
              handle.write(f"failed_critical={','.join(failed)}\n")
              handle.write(f"coverage_ready={'true' if coverage_ready else 'false'}\n")
              handle.write(f"failed_coverage={','.join(failed_coverage)}\n")
          if promote:
              print("Critical-source and directory-coverage gates passed; governed feed may be promoted")
          else:
              print("Governed feed held back.")
              if failed:
                  print("Failed critical sources:", ", ".join(failed))
              if failed_coverage:
                  print("Failed coverage checks:", ", ".join(failed_coverage))
              print(json.dumps(coverage.get("metrics", {}), indent=2))
          PY
      - name: Prepare segregated review bundles
        shell: bash
        run: |
          set -euo pipefail
          ROOT="${{ steps.locate.outputs.root }}"
          SITE_SLUG="${{ steps.bundle.outputs.slug }}"
          mkdir -p "$ROOT/public-build" "$ROOT/site-import" "$ROOT/test-review" "$ROOT/internal-audit"

          cp -r "$ROOT/public/." "$ROOT/public-build/"
          cp -r "$ROOT/$SITE_SLUG/." "$ROOT/site-import/"

          cp "$ROOT/quality-report.json" "$ROOT/test-review/"
          cp "$ROOT/coverage-report.json" "$ROOT/test-review/"
          cp "$ROOT/source-health.json" "$ROOT/test-review/"
          cp "$ROOT/review-queue.json" "$ROOT/test-review/"

          cp "$ROOT/listings.json" "$ROOT/internal-audit/"
          cp "$ROOT/listings.csv" "$ROOT/internal-audit/"
          cp "$ROOT/listings.geojson" "$ROOT/internal-audit/"
          cp "$ROOT/quality-report.json" "$ROOT/internal-audit/"
          cp "$ROOT/coverage-report.json" "$ROOT/internal-audit/"
          cp "$ROOT/source-health.json" "$ROOT/internal-audit/"
          cp "$ROOT/source-provenance.json" "$ROOT/internal-audit/"
          cp "$ROOT/review-queue.json" "$ROOT/internal-audit/"
          cp "$ROOT/project-health.json" "$ROOT/internal-audit/"
      - name: Stage latest governed site feed
        if: steps.promote.outputs.promote == 'true'
        shell: bash
        run: |
          set -euo pipefail
          ROOT="${{ steps.locate.outputs.root }}"
          SITE_SLUG="${{ steps.bundle.outputs.slug }}"
          mkdir -p "published/$SITE_SLUG"
          cp "$ROOT/$SITE_SLUG/directory.v1.json" "published/$SITE_SLUG/directory.v1.json"
          cp "$ROOT/$SITE_SLUG/directory.v1.js" "published/$SITE_SLUG/directory.v1.js"
          cp "$ROOT/$SITE_SLUG/manifest.v1.json" "published/$SITE_SLUG/manifest.v1.json"
      - name: Preserve prior governed feed when release gates fail
        if: steps.promote.outputs.promote != 'true'
        run: |
          echo "Not promoting this harvest."
          echo "Failed critical sources=${{ steps.promote.outputs.failed_critical }}"
          echo "Coverage ready=${{ steps.promote.outputs.coverage_ready }}"
          echo "Failed coverage checks=${{ steps.promote.outputs.failed_coverage }}"
      - name: Stage bounded harvest status
        shell: bash
        run: |
          set -euo pipefail
          ROOT="${{ steps.locate.outputs.root }}"
          SITE_SLUG="${{ steps.bundle.outputs.slug }}"
          STATUS_PATH="published/$SITE_SLUG/harvest-status.json"
          mkdir -p "published/$SITE_SLUG"
          python - \
            "$ROOT/source-health.json" \
            "$ROOT/coverage-report.json" \
            "$STATUS_PATH" \
            "${{ steps.promote.outputs.promote }}" \
            "${{ steps.promote.outputs.failed_critical }}" \
            "${{ steps.promote.outputs.failed_coverage }}" <<'PY'
          import json, pathlib, sys
          health_path, coverage_path, output_path, promote_value, failed_critical, failed_coverage = sys.argv[1:]
          health = json.load(open(health_path, encoding="utf-8"))
          coverage = json.load(open(coverage_path, encoding="utf-8"))
          promoted = promote_value.casefold() == "true"
          source_summary = [
              {
                  "source": str(item.get("source") or ""),
                  "ok": bool(item.get("ok")),
                  "records": int(item.get("records") or 0),
              }
              for item in health.get("sources", [])
          ]
          status = {
              "schema_version": "1.0",
              "generated_at": coverage.get("generated_at") or health.get("generated_at"),
              "site": pathlib.Path(output_path).parent.name,
              "feed_promoted": promoted,
              "preserved_previous_feed": not promoted,
              "coverage_ready": bool(coverage.get("ready")),
              "failed_critical_sources": [value for value in failed_critical.split(",") if value],
              "failed_coverage_checks": [value for value in failed_coverage.split(",") if value],
              "source_summary": source_summary,
              "metrics": coverage.get("metrics", {}),
          }
          pathlib.Path(output_path).write_text(json.dumps(status, indent=2), encoding="utf-8")
          print(json.dumps(status, indent=2))
          PY
      - name: Commit harvest status and governed feed
        shell: bash
        run: |
          set -euo pipefail
          SITE_SLUG="${{ steps.bundle.outputs.slug }}"
          if [ -z "$(git status --porcelain -- "published/$SITE_SLUG")" ]; then
            echo "Published directory state unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "published/$SITE_SLUG"
          if [ "${{ steps.promote.outputs.promote }}" = "true" ]; then
            git commit -m "data: refresh governed $SITE_SLUG directory feed"
          else
            git commit -m "ops: record held $SITE_SLUG directory harvest"
          fi
          git push
      - name: Upload public build
        uses: actions/upload-artifact@v4
        with:
          name: local-directory-public-build
          path: ${{ steps.locate.outputs.root }}/public-build/
      - name: Upload configured site import
        uses: actions/upload-artifact@v4
        with:
          name: local-directory-${{ steps.bundle.outputs.slug }}-import
          path: ${{ steps.locate.outputs.root }}/site-import/
      - name: Upload test review
        uses: actions/upload-artifact@v4
        with:
          name: local-directory-test-review
          path: ${{ steps.locate.outputs.root }}/test-review/
      - name: Upload internal audit
        uses: actions/upload-artifact@v4
        with:
          name: local-directory-internal-audit
          path: ${{ steps.locate.outputs.root }}/internal-audit/
