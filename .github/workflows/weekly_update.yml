name: Weekly Local Directory Harvest

on:
  workflow_dispatch:
    inputs:
      config_path:
        description: "Configuration path"
        required: false
        default: "config/lewes.yaml"
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "config/**"
      - "scripts/**"
      - "data/manual/**"
      - ".github/workflows/weekly_update.yml"
  schedule:
    - cron: "35 6 * * 1"

permissions:
  contents: write

concurrency:
  group: local-directory-harvest-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUNBUFFERED: "1"

jobs:
  harvest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Tests
        run: pytest -q
      - name: Run harvest
        env:
          COMPANIES_HOUSE_API_KEY: ${{ secrets.COMPANIES_HOUSE_API_KEY }}
          LOCALDIRECTORY_USER_AGENT: "LocalDirectory/0.1 (+https://github.com/sccnexusdata/LocalDirectory)"
        run: python run.py run --config "${{ inputs.config_path || 'config/lewes.yaml' }}"
      - name: Locate generated output
        id: locate
        shell: bash
        run: |
          set -euo pipefail
          QUALITY="$(find exports -name quality-report.json -print | head -n 1)"
          if [ -z "$QUALITY" ]; then
            echo "No quality-report.json generated"
            find exports -maxdepth 3 -type f -print || true
            exit 1
          fi
          ROOT="$(dirname "$QUALITY")"
          echo "root=$ROOT" >> "$GITHUB_OUTPUT"
          echo "Output root: $ROOT"
      - name: Validate public deployment gate
        run: python scripts/validate_public_bundle.py "${{ steps.locate.outputs.root }}/public"
      - name: Build health report
        run: python scripts/project_health.py --exports-dir "${{ steps.locate.outputs.root }}" --output "${{ steps.locate.outputs.root }}/project-health.json"
      - name: Evaluate feed promotion eligibility
        id: promote
        shell: bash
        run: |
          set -euo pipefail
          ROOT="${{ steps.locate.outputs.root }}"
          python - "$ROOT/source-health.json" "$ROOT/coverage-report.json" "$GITHUB_OUTPUT" <<'PY'
          import json, sys
          health_path, coverage_path, output_path = sys.argv[1:]
          health = json.load(open(health_path, encoding="utf-8"))
          coverage = json.load(open(coverage_path, encoding="utf-8"))
          by_source = {item.get("source"): item for item in health.get("sources", [])}
          critical = ("fhrs", "osm_overpass")
          failed = [name for name in critical if not by_source.get(name, {}).get("ok")]
          failed_coverage = [name for name, passed in coverage.get("checks", {}).items() if not passed]
          coverage_ready = bool(coverage.get("ready"))
          promote = not failed and coverage_ready
          with open(output_path, "a", encoding="utf-8") as handle:
              handle.write(f"promote={'true' if promote else 'false'}\n")
              handle.write(f"failed_critical={','.join(failed)}\n")
              handle.write(f"coverage_ready={'true' if coverage_ready else 'false'}\n")
              handle.write(f"failed_coverage={','.join(failed_coverage)}\n")
          if promote:
              print("Critical-source and directory-coverage gates passed; governed feed may be promoted")
          else:
              print("Governed feed held back.")
              if failed:
                  print("Failed critical sources:", ", ".join(failed))
              if failed_coverage:
                  print("Failed coverage checks:", ", ".join(failed_coverage))
              print(json.dumps(coverage.get("metrics", {}), indent=2))
          PY
      - name: Prepare segregated review bundles
        shell: bash
        run: |
          set -euo pipefail
          ROOT="${{ steps.locate.outputs.root }}"
          mkdir -p "$ROOT/public-build" "$ROOT/leweslive-import" "$ROOT/test-review" "$ROOT/internal-audit"

          cp -r "$ROOT/public/." "$ROOT/public-build/"
          cp -r "$ROOT/leweslive/." "$ROOT/leweslive-import/"

          cp "$ROOT/quality-report.json" "$ROOT/test-review/"
          cp "$ROOT/coverage-report.json" "$ROOT/test-review/"
          cp "$ROOT/source-health.json" "$ROOT/test-review/"
          cp "$ROOT/review-queue.json" "$ROOT/test-review/"

          cp "$ROOT/listings.json" "$ROOT/internal-audit/"
          cp "$ROOT/listings.csv" "$ROOT/internal-audit/"
          cp "$ROOT/listings.geojson" "$ROOT/internal-audit/"
          cp "$ROOT/quality-report.json" "$ROOT/internal-audit/"
          cp "$ROOT/coverage-report.json" "$ROOT/internal-audit/"
          cp "$ROOT/source-health.json" "$ROOT/internal-audit/"
          cp "$ROOT/source-provenance.json" "$ROOT/internal-audit/"
          cp "$ROOT/review-queue.json" "$ROOT/internal-audit/"
          cp "$ROOT/project-health.json" "$ROOT/internal-audit/"
      - name: Stage latest governed LewesLive feed
        if: steps.promote.outputs.promote == 'true'
        shell: bash
        run: |
          set -euo pipefail
          ROOT="${{ steps.locate.outputs.root }}"
          mkdir -p published/leweslive
          cp "$ROOT/leweslive/directory.v1.json" published/leweslive/directory.v1.json
          cp "$ROOT/leweslive/directory.v1.js" published/leweslive/directory.v1.js
          cp "$ROOT/leweslive/manifest.v1.json" published/leweslive/manifest.v1.json
      - name: Preserve prior governed feed when release gates fail
        if: steps.promote.outputs.promote != 'true'
        run: |
          echo "Not promoting this harvest."
          echo "Failed critical sources=${{ steps.promote.outputs.failed_critical }}"
          echo "Coverage ready=${{ steps.promote.outputs.coverage_ready }}"
          echo "Failed coverage checks=${{ steps.promote.outputs.failed_coverage }}"
      - name: Commit latest governed feed
        if: steps.promote.outputs.promote == 'true'
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain -- published/leweslive)" ]; then
            echo "Governed feed unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add published/leweslive
          git commit -m "data: refresh governed LewesLive directory feed"
          git push
      - name: Upload public build
        uses: actions/upload-artifact@v4
        with:
          name: local-directory-public-build
          path: ${{ steps.locate.outputs.root }}/public-build/
      - name: Upload LewesLive import
        uses: actions/upload-artifact@v4
        with:
          name: local-directory-leweslive-import
          path: ${{ steps.locate.outputs.root }}/leweslive-import/
      - name: Upload test review
        uses: actions/upload-artifact@v4
        with:
          name: local-directory-test-review
          path: ${{ steps.locate.outputs.root }}/test-review/
      - name: Upload internal audit
        uses: actions/upload-artifact@v4
        with:
          name: local-directory-internal-audit
          path: ${{ steps.locate.outputs.root }}/internal-audit/
