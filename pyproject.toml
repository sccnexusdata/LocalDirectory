[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "localdirectory"
version = "0.1.0"
description = "Reusable evidence-led local directory harvesting and publication engine."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "SCC Nexus Data"}]
dependencies = [
  "beautifulsoup4>=4.12",
  "PyYAML>=6.0",
  "requests>=2.31",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.5",
]

[project.scripts]
localdirectory = "localdirectory.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# Import layout is not semantically significant and the runner deliberately isolates
# individual third-party plugin failures so one unavailable source cannot abort a harvest.
ignore = ["E501", "I001", "BLE001"]
